name: Sail checks

on:
  push:
    branches: [master, main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  assessment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap Sail
        run: |
          cp .env.example .env
          sed -i "s/^WWWUSER=.*/WWWUSER=$(id -u)/; s/^WWWGROUP=.*/WWWGROUP=$(id -g)/" .env
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/var/www/html" -w /var/www/html \
            laravelsail/php84-composer:latest composer install --no-interaction --prefer-dist --ignore-platform-reqs
          ./vendor/bin/sail build laravel.test
          ./vendor/bin/sail up -d --wait

      - name: Prepare demo and build frontend
        run: |
          ./vendor/bin/sail composer check-platform-reqs
          ./vendor/bin/sail artisan key:generate
          ./vendor/bin/sail artisan migrate --seed --force
          ./vendor/bin/sail npm ci
          ./vendor/bin/sail npm run build

      - name: PHP tests and code checks
        run: |
          ./vendor/bin/sail artisan test
          ./vendor/bin/sail pint --test
          ./vendor/bin/sail npx eslint .
          ./vendor/bin/sail npm run typecheck

      - name: Browser tests
        run: |
          ./vendor/bin/sail exec -u root laravel.test npx playwright install --with-deps chromium
          ./vendor/bin/sail npm run test:e2e

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --tail=150

      - name: Stop services
        if: always()
        run: docker compose down --volumes
